{% extends "base.html" %} {% block title %} RideLink - Add Child {% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card bg-dark border-secondary p-4">
      <h2 class="text-white mb-4">
        <i class="bi bi-person-plus text-info me-2"></i>

        Add Child
      </h2>

      <form action="/add-child" method="POST">
        <div class="mb-3">
          <label class="text-secondary"> Child Name </label>

          <input
            class="form-control"
            name="name"
            placeholder="Child name"
            required
          />
        </div>

        <div class="mb-3">
          <label class="text-secondary"> Grade Level </label>

          <select class="form-select" name="grade_level" required>
            <option>Kindergarten</option>

            <option>1st Grade</option>

            <option>2nd Grade</option>

            <option>3rd Grade</option>

            <option>4th Grade</option>

            <option>5th Grade</option>

            <option>6th Grade</option>

            <option>7th Grade</option>

            <option>8th Grade</option>

            <option>9th Grade</option>

            <option>10th Grade</option>

            <option>11th Grade</option>

            <option>12th Grade</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="text-secondary"> Campus </label>

          <select class="form-select" name="campus" required>
            <option>Elementary</option>

            <option>Middle School</option>

            <option>High School</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="text-secondary"> Activities </label>

          <input
            class="form-control"
            name="activities"
            placeholder="Soccer, Robotics, Band..."
          />
        </div>

        <button class="btn btn-info text-dark fw-bold w-100">
          <i class="bi bi-check-circle me-2"></i>

          Save Child
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
