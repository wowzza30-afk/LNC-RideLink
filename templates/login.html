{% extends "base.html" %} {% block title %} LNC RideLink - Parent Login {% endblock
%} {% block navbar %} {% endblock %} {% block content %}

<div
  class="d-flex justify-content-center align-items-center"
  style="min-height: 80vh"
>
  <div
    class="card bg-dark border-secondary p-4"
    style="max-width: 450px; width: 100%"
  >
    <div class="text-center mb-4">
      <i class="bi bi-car-front-fill text-info display-3"></i>

      <h1 class="text-white fw-bold mt-3">LNC RideLink</h1>

      <p class="text-secondary">Safe community transportation for Lake Norman Charter School.</p>
    </div>

    <ul class="nav nav-pills nav-fill mb-4">
      <li class="nav-item">
        <button
          class="nav-link active"
          data-bs-toggle="pill"
          data-bs-target="#login"
        >
          Login
        </button>
      </li>

      <li class="nav-item">
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#register"
        >
          Create Parent Account
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- =========================
LOGIN
========================= -->

      <div class="tab-pane fade show active" id="login">
        <form action="/login" method="POST">
          <div class="mb-3">
            <label class="text-secondary"> Email </label>

            <input type="email" class="form-control" name="email" required />
          </div>

          <div class="mb-4">
            <label class="text-secondary"> Password </label>

            <input
              type="password"
              class="form-control"
              name="password"
              required
            />
          </div>

          <button class="btn btn-info text-dark fw-bold w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>

            Login
          </button>
        </form>
      </div>

      <!-- =========================
REGISTER
========================= -->

      <div class="tab-pane fade" id="register">
        <form action="/register" method="POST">
          <div class="mb-3">
            <label class="text-secondary"> Parent / Guardian Name </label>

            <input
              class="form-control"
              name="name"
              placeholder="Jane Smith"
              required
            />
          </div>

          <div class="mb-3">
            <label class="text-secondary"> Email </label>

            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="parent@email.com"
              required
            />
          </div>

          <div class="mb-3">
            <label class="text-secondary"> Phone Number </label>

            <input
              class="form-control"
              name="phone"
              placeholder="(555) 555-5555"
            />
          </div>

          <div class="mb-3">
            <label class="text-secondary"> Neighborhood Location</label>

            <select class="form-select" name="neighborhood">
              <option>Harrisburg</option>

              <option>Huntersville</option>

              <option>Cornelius</option>

              <option>Davidson</option>

              <option>Concord</option>

              <option>Charlotte</option>

              <option>Other</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="text-secondary"> Password </label>

            <input
              type="password"
              class="form-control"
              name="password"
              minlength="6"
              required
            />
          </div>

          <button class="btn btn-success fw-bold w-100">
            <i class="bi bi-person-plus-fill me-2"></i>

            Create Parent Account
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %} {% block footer %} {% endblock %}
