{% extends "base.html" %} {% block title %} LNC RideLink - Parent Login {%
endblock %} {% block navbar %} {% endblock %} {% block content %}

<div
  class="d-flex justify-content-center align-items-center"
  style="min-height: 80vh"
>
  <div
    class="card bg-dark border-secondary p-4"
    style="max-width: 450px; width: 100%"
  >
    <div class="text-center mb-4">
      <i class="bi bi-car-front-fill text-info display-3"></i>

      <h1 class="text-white fw-bold mt-3">LNC RideLink</h1>

      <p class="text-secondary">
        Safe community transportation for Lake Norman Charter School.
      </p>
    </div>

    <ul class="nav nav-pills nav-fill mb-4">
      <li class="nav-item">
        <button
          class="nav-link active"
          data-bs-toggle="pill"
          data-bs-target="#login"
        >
          Login
        </button>
      </li>

      <li class="nav-item">
        <button
          class="nav-link"
          data-bs-toggle="pill"
          data-bs-target="#register"
        >
          Create Parent Account
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- =========================
LOGIN
========================= -->

      <div class="tab-pane fade show active" id="login">
        <form action="/login" method="POST">
          <div class="mb-3">
            <label class="text-secondary"> Email </label>

            <input type="email" class="form-control" name="email" required />
          </div>

          <div class="mb-4">
            <label class="text-secondary"> Password </label>

            <input
              type="password"
              class="form-control"
              name="password"
              required
            />
          </div>

          <button class="btn btn-info text-dark fw-bold w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>

            Login
          </button>
        </form>
      </div>

      <!-- =========================
REGISTER
========================= -->

      <div class="tab-pane fade" id="register">
        <form action="/register" method="POST">
          <div class="mb-3">
            <label class="text-secondary"> Parent / Guardian Name </label>

            <input
              class="form-control"
              name="name"
              placeholder="Jane Smith"
              required
            />
          </div>

          <div class="mb-3">
            <label class="text-secondary"> Email </label>

            <input
              type="email"
              class="form-control"
              name="email"
              placeholder="parent@email.com"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary">Phone Number</label>

            <input
              type="tel"
              class="form-control"
              name="phone"
              id="phone"
              placeholder="(704) 555-1234"
              maxlength="14"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label"> Neighborhood Location </label>

            <select
              id="neighborhood"
              name="neighborhood"
              class="form-select"
              onchange="toggleNeighborhood()"
            >
              <option>Harrisburg</option>

              <option>Huntersville</option>

              <option>Cornelius</option>

              <option>Davidson</option>

              <option>Concord</option>

              <option>Charlotte</option>

              <option>Moorseville</option>

              <option value="Other">Other</option>
            </select>
          </div>

          <div id="other-neighborhood-div" class="mb-3" style="display: none">
            <label class="form-label"> Enter Neighborhood Location</label>

            <input
              type="text"
              id="other-neighborhood"
              class="form-control"
              placeholder="Example: Denver"
            />
          </div>

          <div class="mb-4">
            <label class="text-secondary"> Password </label>

            <input
              type="password"
              class="form-control"
              name="password"
              minlength="6"
              required
            />
          </div>

          <button class="btn btn-success fw-bold w-100">
            <i class="bi bi-person-plus-fill me-2"></i>

            Create Parent Account
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  function toggleNeighborhood() {
    const dropdown = document.getElementById("neighborhood");
    const otherDiv = document.getElementById("other-neighborhood-div");
    const otherInput = document.getElementById("other-neighborhood");

    if (dropdown.value === "Other") {
      otherDiv.style.display = "block";

      otherInput.name = "neighborhood";

      dropdown.name = "";

      otherInput.required = true;
    } else {
      otherDiv.style.display = "none";

      otherInput.name = "";

      dropdown.name = "neighborhood";

      otherInput.required = false;

      otherInput.value = "";
    }
  }
</script>

<script>
  const phoneInput = document.getElementById("phone");

  phoneInput.addEventListener("input", function () {
    let numbers = this.value.replace(/\D/g, "");

    numbers = numbers.substring(0, 10);

    if (numbers.length > 6) {
      this.value =
        "(" +
        numbers.substring(0, 3) +
        ") " +
        numbers.substring(3, 6) +
        "-" +
        numbers.substring(6);
    } else if (numbers.length > 3) {
      this.value = "(" + numbers.substring(0, 3) + ") " + numbers.substring(3);
    } else if (numbers.length > 0) {
      this.value = "(" + numbers;
    }
  });
</script>
{% endblock %} {% block footer %} {% endblock %}
